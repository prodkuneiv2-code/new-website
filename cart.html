<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตะกร้าสินค้า | RaydeeSolar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <style>
    .page-header {
      background: var(--dark);
      color: var(--white);
      padding: 120px 0 60px;
      text-align: center;
    }
    .page-header h1 { color: var(--white); margin-bottom: 10px; font-size: 2.5rem; }

    .cart-container {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 40px;
      padding: 60px 20px;
      max-width: var(--container-width);
      margin: 0 auto;
    }

    .cart-items {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .cart-item {
      display: flex;
      align-items: center;
      background: var(--white);
      padding: 20px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      gap: 20px;
      position: relative;
    }
    .cart-item-img {
      width: 100px; height: 100px;
      background: var(--light-alt);
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      color: #94a3b8; font-size: 2rem;
      flex-shrink: 0;
    }
    .cart-item-img img { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; }
    .cart-item-details { flex-grow: 1; }
    .cart-item-name { font-size: 1.1rem; font-weight: 600; color: var(--dark); margin-bottom: 5px; }
    .cart-item-price { color: var(--primary); font-weight: 700; margin-bottom: 10px; }
    
    .qty-controls {
      display: flex; align-items: center; gap: 10px;
    }
    .qty-btn {
      width: 32px; height: 32px; border: 1px solid var(--border);
      background: var(--white); border-radius: var(--radius-sm);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .qty-btn:hover { border-color: var(--primary); color: var(--primary); }
    .qty-display { width: 40px; text-align: center; font-weight: 500; }
    
    .cart-item-total {
      font-weight: 700; font-size: 1.1rem; color: var(--dark);
      text-align: right; min-width: 100px;
    }
    .remove-btn {
      position: absolute; top: 15px; right: 20px;
      color: var(--danger); background: none; border: none;
      cursor: pointer; font-size: 1.2rem; padding: 5px; opacity: 0.6;
      transition: var(--transition);
    }
    .remove-btn:hover { opacity: 1; transform: scale(1.1); }

    .cart-summary {
      background: var(--white);
      padding: 30px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      height: fit-content;
      position: sticky;
      top: 100px;
    }
    .cart-summary h3 { margin-bottom: 20px; font-size: 1.4rem; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
    .summary-row {
      display: flex; justify-content: space-between; margin-bottom: 15px;
      color: var(--text-muted); font-size: 1.05rem;
    }
    .summary-total {
      display: flex; justify-content: space-between; margin-top: 20px; padding-top: 20px;
      border-top: 1px solid var(--border);
      font-weight: 700; font-size: 1.4rem; color: var(--dark);
      margin-bottom: 30px;
    }
    .checkout-btn { width: 100%; padding: 15px; font-size: 1.1rem; }

    .empty-cart {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      background: var(--white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
    }
    .empty-cart i { font-size: 4rem; color: #cbd5e1; margin-bottom: 20px; display: block; }
    .empty-cart h3 { font-size: 1.5rem; margin-bottom: 10px; }
    .empty-cart p { color: var(--text-muted); margin-bottom: 30px; }

    @media (max-width: 992px) {
      .cart-container { grid-template-columns: 1fr; }
      .cart-summary { position: static; }
    }
    @media (max-width: 576px) {
      .cart-item { flex-direction: column; align-items: stretch; position: relative; }
      .cart-item-img { width: 100%; height: 200px; }
      .cart-item-total { text-align: left; margin-top: 15px; }
      .remove-btn { top: 215px; right: 20px; }
    }
  </style>
</head>
<body>
  <div id="navbar-placeholder"></div>

  <div class="page-header">
    <div class="container">
      <h1>ตะกร้าสินค้า</h1>
    </div>
  </div>

  <div class="cart-container" id="cartContainer">
    <!-- Cart content loaded via JS -->
  </div>

  <div id="footer-placeholder"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/shop.js"></script>
</body>
</html>
