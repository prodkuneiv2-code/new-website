<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สั่งซื้อสำเร็จ | RaydeeSolar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <style>
    .success-container {
      max-width: 800px;
      margin: 100px auto;
      padding: 0 20px;
    }
    
    .success-card {
      background: var(--white);
      border-radius: var(--radius-lg);
      padding: 50px 40px;
      text-align: center;
      box-shadow: var(--shadow-lg);
      border-top: 6px solid var(--success);
    }

    .success-icon {
      width: 100px; height: 100px;
      background: var(--success-bg);
      color: var(--success);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 3rem;
      margin: 0 auto 30px;
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      0% { transform: scale(0); }
      80% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    .success-card h1 { font-size: 2rem; margin-bottom: 15px; color: var(--dark); }
    .success-card p { color: var(--text-muted); font-size: 1.1rem; margin-bottom: 30px; }

    .order-details-box {
      background: var(--light-alt);
      border-radius: var(--radius-sm);
      padding: 30px;
      text-align: left;
      margin-bottom: 30px;
      display: flex; flex-direction: column; gap: 15px;
    }
    .order-row { display: flex; justify-content: space-between; border-bottom: 1px dashed var(--border); padding-bottom: 10px; }
    .order-row:last-child { border: none; padding-bottom: 0; }
    .row-label { color: var(--text-muted); }
    .row-value { font-weight: 500; color: var(--dark); text-align: right; }
    .total-value { font-size: 1.3rem; font-weight: 700; color: var(--primary); }

    .payment-instruction {
      background: rgba(232, 165, 0, 0.1);
      border: 1px solid var(--accent);
      padding: 20px;
      border-radius: var(--radius-sm);
      text-align: left;
      margin-bottom: 40px;
      display: none; /* Shown conditionally via JS */
    }
    .payment-instruction h4 { color: var(--dark); margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
    .payment-instruction p { margin-bottom: 5px; font-size: 1rem; color: var(--text); }

    .action-buttons {
      display: flex; gap: 15px; justify-content: center;
    }
    
    @media (max-width: 576px) {
      .success-card { padding: 40px 20px; }
      .action-buttons { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div id="navbar-placeholder"></div>

  <div class="success-container">
    <div class="success-card">
      <div class="success-icon"><i class="fas fa-check"></i></div>
      <h1>สั่งซื้อสำเร็จ!</h1>
      <p id="thankYouText">ขอบคุณที่ไว้วางใจ ทางเราได้รับคำสั่งซื้อของคุณเรียบร้อยแล้ว</p>

      <div class="order-details-box">
        <div class="order-row">
          <span class="row-label">หมายเลขคำสั่งซื้อ:</span>
          <span class="row-value" id="dispOrderId">-</span>
        </div>
        <div class="order-row">
          <span class="row-label">วันที่สั่งซื้อ:</span>
          <span class="row-value" id="dispDate">-</span>
        </div>
        <div class="order-row">
          <span class="row-label">วิธีชำระเงิน:</span>
          <span class="row-value" id="dispPayment">-</span>
        </div>
        <div class="order-row">
          <span class="row-label">ยอดชำระสุทธิ:</span>
          <span class="row-value total-value" id="dispTotal">-</span>
        </div>
      </div>

      <div class="payment-instruction" id="paymentInstruction">
        <!-- Rendered by JS -->
      </div>

      <div class="action-buttons">
        <a href="index.html" class="btn btn-primary">กลับหน้าหลัก</a>
        <a href="shop.html" class="btn btn-outline">เลือกซื้อสินค้าต่อ</a>
      </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const orderId = urlParams.get('id');
      
      if (!orderId) {
        window.location.href = 'index.html';
        return;
      }

      const orders = getData(LS_KEYS.orders) || [];
      const order = orders.find(o => o.id === orderId);

      if (!order) {
        document.getElementById('thankYouText').textContent = 'ไม่พบข้อมูลคำสั่งซื้อที่ระบุ';
        return;
      }

      // Populate summary
      document.getElementById('dispOrderId').textContent = order.id;
      document.getElementById('dispDate').textContent = new Date(order.timestamp).toLocaleString('th-TH');
      document.getElementById('dispPayment').textContent = order.paymentMethod;
      document.getElementById('dispTotal').textContent = formatPrice(order.grandTotal);

      // Show payment instructions based on method
      const siteConfig = getData(LS_KEYS.siteConfig) || DEFAULT_SITE_CONFIG;
      const instructEl = document.getElementById('paymentInstruction');

      if (order.paymentMethod === 'โอนเงินผ่านธนาคาร') {
        instructEl.style.display = 'block';
        instructEl.innerHTML = `
          <h4><i class="fas fa-university" style="color:var(--primary)"></i> ข้อมูลบัญชีธนาคารสำหรับโอนเงิน</h4>
          <p>ธนาคาร: <strong>${siteConfig.bankName}</strong></p>
          <p>ชื่อบัญชี: <strong>${siteConfig.bankAccountName}</strong></p>
          <p>เลขบัญชี: <strong style="font-size:1.2rem; color:var(--primary)">${siteConfig.bankAccountNumber}</strong></p>
          <p style="margin-top:10px; font-size:0.9rem; color:var(--text-muted);">
            *กรุณาโอนเงินตามยอดสุทธิและส่งหลักฐานการโอนมาที่ LINE: <a href="${siteConfig.lineUrl}" target="_blank">${siteConfig.lineId}</a> พร้อมแจ้งหมายเลขคำสั่งซื้อ
          </p>
        `;
      } else if (order.paymentMethod === 'PromptPay') {
        instructEl.style.display = 'block';
        instructEl.innerHTML = `
          <h4><i class="fas fa-qrcode" style="color:#113566"></i> พร้อมเพย์ (PromptPay)</h4>
          <div style="text-align:center; margin: 15px 0;">
            <div style="width:150px; height:150px; background:#fff; padding:10px; border:1px solid #ddd; margin:0 auto; display:flex; align-items:center; justify-content:center;">
              <i class="fas fa-qrcode" style="font-size:5rem; color:#ccc;"></i>
            </div>
            <p style="margin-top:10px;">เบอร์พร้อมเพย์: <strong style="font-size:1.2rem; color:var(--primary)">${siteConfig.promptPayNumber}</strong></p>
            <p><strong>${siteConfig.bankAccountName}</strong></p>
          </div>
          <p style="text-align:center; font-size:0.9rem; color:var(--text-muted);">
            *กรุณาโอนเงินและส่งสลิปมาที่ LINE: <a href="${siteConfig.lineUrl}" target="_blank">${siteConfig.lineId}</a>
          </p>
        `;
      } else if (order.paymentMethod === 'เก็บเงินปลายทาง') {
        instructEl.style.display = 'block';
        instructEl.innerHTML = `
          <h4><i class="fas fa-truck" style="color:var(--success)"></i> เก็บเงินปลายทาง</h4>
          <p>คุณได้เลือกชำระเงินปลายทาง กรุณาเตรียมเงินสด <strong>${formatPrice(order.grandTotal)}</strong> ให้พร้อมในวันรับสินค้า</p>
          <p style="margin-top:10px; font-size:0.9rem; color:var(--text-muted);">
            *เจ้าหน้าที่จะติดต่อกลับที่เบอร์ <strong>${order.customer.phone}</strong> เพื่อยืนยันการจัดส่ง
          </p>
        `;
      }
    });
  </script>
</body>
</html>
