<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ขอใบเสนอราคาติดตั้งโซล่าเซลล์ | RaydeeSolar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <style>
    .page-header {
      background: var(--primary);
      color: var(--white);
      padding: 100px 0 60px;
      text-align: center;
    }
    .page-header h1 { color: var(--white); margin-bottom: 15px; font-size: 2.2rem; }

    .quote-container {
      max-width: 800px;
      margin: -30px auto 80px;
      background: var(--white);
      border-radius: var(--radius-lg);
      padding: 40px;
      box-shadow: var(--shadow-lg);
      position: relative;
      z-index: 10;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .full-width { grid-column: 1 / -1; }

    .required { color: var(--danger); margin-left: 4px; }

    .quote-success {
      display: none;
      text-align: center;
      padding: 40px 20px;
    }
    .quote-success i { font-size: 4rem; color: var(--success); margin-bottom: 20px; }
    .quote-success h2 { color: var(--dark); margin-bottom: 15px; }
    .quote-success p { color: var(--text-muted); font-size: 1.1rem; margin-bottom: 30px; }
    
    @media (max-width: 768px) {
      .form-grid { grid-template-columns: 1fr; }
      .quote-container { padding: 30px 20px; margin-top: -20px; }
    }
  </style>
</head>
<body>
  <div id="navbar-placeholder"></div>

  <div class="page-header">
    <div class="container">
      <h1>ขอใบเสนอราคาติดตั้งฟรี</h1>
      <p style="opacity: 0.9;">ประเมินพื้นที่และคำนวณราคาเบื้องต้น โดยไม่มีค่าใช้จ่ายแอบแฝง</p>
    </div>
  </div>

  <div class="container">
    <div class="quote-container">
      <!-- Quote Form -->
      <form id="quoteForm">
        <h3 style="margin-bottom: 25px; color: var(--primary); border-bottom: 1px solid var(--border); padding-bottom: 10px;">ข้อมูลผู้ติดต่อ</h3>
        <div class="form-grid" style="margin-bottom: 30px;">
          <div class="form-group full-width">
            <label>ชื่อ-นามสกุล <span class="required">*</span></label>
            <input type="text" class="form-control" id="qName" required>
          </div>
          <div class="form-group">
            <label>เบอร์โทรศัพท์ <span class="required">*</span></label>
            <input type="tel" class="form-control" id="qPhone" required>
          </div>
          <div class="form-group">
            <label>อีเมล (ถ้ามี)</label>
            <input type="email" class="form-control" id="qEmail">
          </div>
          <div class="form-group">
            <label>ช่วงเวลาที่สะดวกให้ติดต่อกลับ</label>
            <select class="form-control" id="qContactTime">
              <option value="any">เวลาใดก็ได้</option>
              <option value="morning">ช่วงเช้า (09:00 - 12:00)</option>
              <option value="afternoon">ช่วงบ่าย (13:00 - 17:00)</option>
            </select>
          </div>
        </div>

        <h3 style="margin-bottom: 25px; color: var(--primary); border-bottom: 1px solid var(--border); padding-bottom: 10px;">ข้อมูลหน้างานเบื้องต้น</h3>
        <div class="form-grid" style="margin-bottom: 30px;">
          <div class="form-group">
            <label>จังหวัดที่จะติดตั้ง <span class="required">*</span></label>
            <input type="text" class="form-control" id="qProvince" placeholder="เช่น สระบุรี" required>
          </div>
          <div class="form-group">
            <label>ค่าไฟเฉลี่ยต่อเดือน (บาท) <span class="required">*</span></label>
            <input type="number" class="form-control" id="qBill" required>
          </div>
          <div class="form-group">
            <label>แพ็คเกจที่สนใจ (ถ้าทราบ)</label>
            <select class="form-control" id="qPackage">
              <option value="ยังไม่แน่ใจ (ต้องการให้แนะนำ)">ยังไม่แน่ใจ (ต้องการให้แนะนำ)</option>
              <option value="Home Basic">Home Basic (3kW)</option>
              <option value="Home Plus">Home Plus (5kW)</option>
              <option value="Business">Business (10kW)</option>
              <option value="Factory">Factory (30kW+)</option>
            </select>
          </div>
          <div class="form-group">
            <label>ขนาดพื้นที่หลังคาประมาณ (ตร.ม.)</label>
            <input type="number" class="form-control" id="qArea" placeholder="ระบุตัวเลข ถ้าทราบ">
          </div>
          <div class="form-group full-width">
            <label>หมายเหตุ / ข้อสงสัยเพิ่มเติม</label>
            <textarea class="form-control" id="qNotes" rows="3" placeholder="ตัวอย่าง: มีผู้ใหญ่อยู่บ้านกลางวัน เปิดแอร์ 2 ตัว..."></textarea>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 15px; font-size: 1.1rem;" id="qSubmitBtn">
          <i class="fas fa-paper-plane"></i> ยืนยันการขอใบเสนอราคา
        </button>
      </form>

      <!-- Success State -->
      <div class="quote-success" id="quoteSuccess">
        <i class="fas fa-check-circle"></i>
        <h2>ส่งข้อมูลเรียบร้อยแล้ว!</h2>
        <p>เจ้าหน้าที่ได้รับข้อมูลหน้างานของคุณแล้ว<br>วิศวกรของเราจะประเมินราคาและติดต่อกลับไปยังเบอร์อ้างอิงของคุณโดยเร็วที่สุด</p>
        <a href="index.html" class="btn btn-primary">กลับสู่หน้าหลัก</a>
      </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Pre-select package from URL param
      const urlParams = new URLSearchParams(window.location.search);
      const pkgParam = urlParams.get('pkg');
      if (pkgParam) {
        const select = document.getElementById('qPackage');
        for(let i=0; i<select.options.length; i++){
          if(select.options[i].value.includes(pkgParam)) {
            select.options[i].selected = true;
            break;
          }
        }
      }

      const form = document.getElementById('quoteForm');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('qSubmitBtn');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> กำลังส่งข้อมูล...';
        btn.disabled = true;

        const name = document.getElementById('qName').value.trim();
        const phone = document.getElementById('qPhone').value.trim();
        const email = document.getElementById('qEmail').value.trim();
        const contactTime = document.getElementById('qContactTime').value;
        const province = document.getElementById('qProvince').value.trim();
        const bill = document.getElementById('qBill').value;
        const pkg = document.getElementById('qPackage').value;
        const area = document.getElementById('qArea').value;
        const notes = document.getElementById('qNotes').value.trim();

        const quoteData = {
          id: generateId('QT'),
          timestamp: new Date().toISOString(),
          status: 'new', // new, processing, offered, closed
          name: name,
          phone: phone,
          email: email,
          contactTime: contactTime,
          province: province,
          bill: bill,
          package: pkg,
          area: area,
          notes: notes
        };

        let quotes = getData(LS_KEYS.quotes) || [];
        quotes.unshift(quoteData);
        saveData(LS_KEYS.quotes, quotes);

        // Send to Google Sheets Backend (reusing formType: 'contact')
        if (typeof GOOGLE_SCRIPT_URL !== 'undefined' && GOOGLE_SCRIPT_URL) {
          try {
            const fd = new FormData();
            fd.append('formType', 'contact');
            fd.append('timestamp', new Date().toLocaleString('th-TH'));
            fd.append('name', name);
            fd.append('phone', phone);
            fd.append('topic', 'ขอใบเสนอราคา (ประเมินหน้างาน)');
            
            let detailStr = `แพ็คเกจที่สนใจ: ${pkg}\nค่าไฟเฉลี่ย: ${bill} บาท\nจังหวัด: ${province}\nสะดวกให้ติดต่อ: ${contactTime}`;
            if(area) detailStr += `\nพื้นที่หลังคา: ${area} ตร.ม.`;
            if(notes) detailStr += `\nหมายเหตุ: ${notes}`;
            if(email) detailStr += `\nอีเมล: ${email}`;

            fd.append('detail', detailStr);

            await fetch(GOOGLE_SCRIPT_URL, {
              method: 'POST',
              mode: 'no-cors',
              body: fd
            });
          } catch (err) {
            console.error('Error syncing quote to DB:', err);
          }
        }

        document.getElementById('quoteForm').style.display = 'none';
        document.getElementById('quoteSuccess').style.display = 'block';
        window.scrollTo({ top: 100, behavior: 'smooth' });
      });
    });
  </script>
</body>
</html>
